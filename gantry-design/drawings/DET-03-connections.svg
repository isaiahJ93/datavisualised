<text x="978" y="956" class="n">BEAM-TO-COLUMN CONNECTION AND BEAM SPLICE</text>
<text x="978" y="972" class="s">Dimensions mm, not to scale. Steel AS 1163 C350L0 / AS/NZS 3678-350, HDG to AS/NZS 4680.</text>
<text x="978" y="984" class="s">Concrete N32 to AS 3600. Bolts Gr 8.8 HDG. Welds SP to AS/NZS 1554.1.</text>
<text x="1348" y="930" class="b">DET-03</text>
<text x="1348" y="956" class="s">Rev P1 — PRELIMINARY</text>
<text x="1348" y="970" class="s">Not for construction until</text>
<text x="1348" y="984" class="s">certified by an engineer.</text>
<text x="14" y="974" class="s">Splices sit 0.5 m into the 6.0 m bay (moment 5.6 kNm ULS, utilisation below 5 %). Bolt after HDG; touch up damaged zinc with two coats of zinc-rich paint.</text>
<text x="14" y="986" class="s">Erection: columns plumbed on levelling nuts, beam lengths landed and bolted, tensioned, alignment checked (beam level ±5 mm, columns plumb ≤ H/500), grout, anchor nuts after 3 days.</text></svg>