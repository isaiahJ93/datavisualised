<text x="978" y="930" class="b">BAG GANTRY — 15 m, 7 HANGERS</text>
<text x="978" y="956" class="n">COLUMN BASE PLATE, ANCHORS AND PAD FOOTING</text>
<text x="978" y="972" class="s">Dimensions mm, not to scale. Steel AS 1163 C350L0 / AS/NZS 3678-350.</text>
<text x="978" y="984" class="s">HDG AS/NZS 4680. Concrete N32. Bolts Gr 8.8 HDG. Welds SP, AS/NZS 1554.1.</text>
<text x="1348" y="930" class="b">DET-01</text>
<text x="1348" y="956" class="s">Rev P1 — PRELIMINARY</text>
<text x="1348" y="970" class="s">Not for construction until</text>
<text x="1348" y="984" class="s">certified by an engineer.</text>
<text x="14" y="974" class="s">Anchor rods set in a plywood template to ±2 mm before the pour. Do not weld to Gr 8.8 rods. Pad top flush with FFL; slab saw-cut 1.9 m square and reinstated.</text>
<text x="14" y="986" class="s">If an existing slab is proposed instead of pads it must be ≥ 300 mm thick and ≥ 25 MPa (cored and tested); assessment by the certifying engineer is required.</text></svg>